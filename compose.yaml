name: translate-realtime

services:
  backend:
    image: translate-realtime-backend:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    # Docker Snap cần NVIDIA runtime để gọi runtime hook đúng cách.
    runtime: nvidia
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      USE_FAKE_MODELS: "false"
      PRELOAD_MODELS: "true"
      PREPARE_TURBO_CACHE: ${PREPARE_TURBO_CACHE:-true}
      HF_HOME: /models/huggingface
      ASR_DEFAULT_MODEL: ${ASR_DEFAULT_MODEL:-turbo}
      ASR_MODEL: Systran/faster-whisper-small
      ASR_TURBO_MODEL: large-v3-turbo
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: int8_float16
      ASR_CPU_THREADS: ${ASR_CPU_THREADS:-4}
      ASR_NUM_WORKERS: 1
      ASR_BEAM_SIZE: 1
      ASR_FINAL_BEAM_SIZE: 5
      ASR_MIN_AUDIO_SEC: 0.6
      ASR_STEP_MS: 600
      ASR_MAX_WINDOW_SEC: 12
      ASR_STABILITY_MARGIN_SEC: 2.5
      ASR_MAX_NO_SPEECH_PROB: 0.65
      ASR_MIN_AVG_LOGPROB: -1.0
      ASR_VAD_THRESHOLD: 0.6
      ASR_VAD_MIN_SPEECH_MS: 250
      ASR_SUPPRESS_PROMOTIONAL_HALLUCINATIONS: "true"
      AUDIO_SAMPLE_RATE: 16000
      SILENCE_FINALIZE_MS: 900
      SPEECH_RMS_THRESHOLD: 0.01
      SPEECH_START_MS: 250
      SPEECH_PREROLL_MS: 350
      NOISE_FLOOR_MULTIPLIER: 2.5
      MAX_UTTERANCE_SEC: 45
      TRANSLATION_MODEL_PATH: /models/nllb-200-distilled-600m-ct2
      TRANSLATION_DEVICE: cuda
      TRANSLATION_COMPUTE_TYPE: int8_float16
      TRANSLATION_INTRA_THREADS: ${TRANSLATION_INTRA_THREADS:-4}
      TRANSLATION_BEAM_SIZE: 3
      TRANSLATION_INTERVAL_MS: 900
      TRANSLATION_DEBOUNCE_MS: 120
      TRANSLATION_MAX_TOKENS: 256
      TRANSLATION_CONTEXT_TURNS: 0
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE_ID:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - model-data:/models
    expose:
      - "8000"
    shm_size: 1gb
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 15s
      timeout: 5s
      start_period: 20m
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia.runtime-hook
              count: all
              capabilities: [gpu]

  frontend:
    image: translate-realtime-frontend:${DEPLOY_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_DEFAULT_ASR_MODEL: ${ASR_DEFAULT_MODEL:-turbo}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    stop_grace_period: 15s

volumes:
  model-data:
  caddy-data:
  caddy-config:
