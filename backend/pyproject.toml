[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "translate-realtime-backend"
version = "0.1.0"
description = "Local realtime speech-to-text and translation backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "lingua-language-detector>=2.1.1,<3",
  "numpy>=1.26,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
models = [
  "faster-whisper>=1.2,<2",
  "sentencepiece>=0.2,<1",
  "transformers>=4.57,<5",
]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
